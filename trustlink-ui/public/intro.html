<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustLink 소개</title>
<style>
  :root {
    --bg: #faf9ff; --ink: #1e1b4b; --muted: #64748b; --line: #cbd5e1;
    --dev: #2563eb; --cus: #ea580c; --tl: #7c3aed; --ok: #059669; --bad: #dc2626; --reg: #0f766e; --ai: #c026d3;
    --card: #ffffff; --soft: #ede9fe;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; display: flex; flex-direction: column; }
  .stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 3fr) minmax(220px, 2fr); gap: 8px 20px; padding: 12px 16px 4px; align-items: center; }
  @media (max-width: 760px) { .stage { grid-template-columns: 1fr; } }
  svg.scene-svg { width: 100%; height: 100%; max-height: 340px; }
  .cap h2 { margin: 0 0 4px; font-size: 20px; }
  .cap .kicker { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--tl); }
  .cap p { margin: 6px 0; font-size: 14px; line-height: 1.55; color: #334155; }
  .cap ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.6; color: #334155; }
  .cap li b { color: var(--ink); }
  .bar { display: flex; align-items: center; gap: 6px; padding: 6px 16px 10px; flex-wrap: wrap; }
  .bar button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; font: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer; }
  .bar button:hover { border-color: var(--tl); }
  .bar button.on { background: var(--tl); color: #fff; border-color: var(--tl); }
  .bar .nav { font-weight: 700; }
  .bar .sp { flex: 1; }
  .tabs { display: flex; gap: 4px; padding: 8px 16px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tabs button { border: 0; border-bottom: 3px solid transparent; background: none; font: inherit; font-size: 13px; padding: 6px 10px; cursor: pointer; color: var(--muted); }
  .tabs button.on { color: var(--ink); font-weight: 700; border-bottom-color: var(--tl); }
  .tabs button .n { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .prog { height: 3px; background: var(--soft); }
  .prog i { display: block; height: 100%; width: 0; background: var(--tl); }

  /* SVG 공통 */
  .fig line, .fig path { stroke-width: 3.2; stroke-linecap: round; fill: none; }
  .fig circle.head { stroke-width: 3.2; fill: #fff; }
  .lbl { font-size: 13px; font-weight: 700; text-anchor: middle; }
  .sm { font-size: 11px; fill: var(--muted); text-anchor: middle; }
  .bub rect { fill: #fff; stroke: var(--line); stroke-width: 1.5; }
  .bub text { font-size: 12.5px; fill: var(--ink); }
  .ground { stroke: var(--line); stroke-width: 2; }

  /* 움직임 — 장면이 보일 때(.play) 다시 시작 */
  .play .walk .lg1 { animation: swing .5s ease-in-out infinite alternate; }
  .play .walk .lg2 { animation: swing .5s ease-in-out infinite alternate-reverse; }
  @keyframes swing { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
  .play .wave { animation: wave .6s ease-in-out infinite alternate; }
  @keyframes wave { from { transform: rotate(-20deg); } to { transform: rotate(30deg); } }
  .play .bob { animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  .play .pop { opacity: 0; animation: pop .45s ease-out forwards; }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
  .pop, .play .pop { transform-box: fill-box; transform-origin: center; }
  .play .fade { opacity: 0; animation: fade .6s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  .play .shake { animation: shake .3s linear infinite; transform-box: fill-box; transform-origin: center top; }
  @keyframes shake { 25% { transform: rotate(12deg); } 75% { transform: rotate(-12deg); } }
  .play .blink { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) {
    .play * { animation-duration: .01s !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; }
  }
</style>
</head>
<body>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="prog"><i id="prog"></i></div>
<div class="stage">
  <svg class="scene-svg" id="svg" viewBox="0 0 640 360" role="img" aria-labelledby="title"></svg>
  <div class="cap" id="cap" aria-live="polite"></div>
</div>
<div class="bar" id="bar"></div>

<script>
// ── 그림 도구: 막대 인형과 소품을 SVG 문자열로 만든다 ──────────────────────
// 인형 기준점은 발 사이(바닥). pose: stand | walk | up(두 팔 위) | hold(앞으로 듦) | point | wave
function fig(x, y, color, label, pose = 'stand', o = {}) {
  const flip = o.flip ? -1 : 1;
  const arms = {
    stand: '<line x1="0" y1="-58" x2="-14" y2="-36"/><line x1="0" y1="-58" x2="14" y2="-36"/>',
    walk:  '<line x1="0" y1="-58" x2="-12" y2="-38"/><line x1="0" y1="-58" x2="16" y2="-40"/>',
    up:    '<line x1="0" y1="-58" x2="-16" y2="-80"/><line x1="0" y1="-58" x2="16" y2="-80"/>',
    hold:  '<path d="M0 -58 L14 -50 L26 -52"/><path d="M0 -58 L12 -44 L26 -46"/>',
    point: '<line x1="0" y1="-58" x2="-12" y2="-36"/><line x1="0" y1="-58" x2="28" y2="-66"/>',
    wave:  '<line x1="0" y1="-58" x2="-12" y2="-36"/><g transform="translate(0,-58)"><line class="wave" x1="0" y1="0" x2="14" y2="-20"/></g>',
  }[pose];
  const legs = pose === 'walk'
    ? '<g transform="translate(0,-28)"><line class="lg1" x1="0" y1="0" x2="0" y2="28"/><line class="lg2" x1="0" y1="0" x2="0" y2="28"/></g>'
    : '<line x1="0" y1="-28" x2="-11" y2="0"/><line x1="0" y1="-28" x2="11" y2="0"/>';
  const face = o.sad ? '<path d="M-5 -66 q5 -4 10 0" stroke-width="2"/>' : '<path d="M-5 -69 q5 4 10 0" stroke-width="2"/>';
  return `<g transform="translate(${x},${y})"><g class="fig ${pose === 'walk' ? 'walk' : ''} ${o.cls || ''}" stroke="${color}">
    <g transform="scale(${flip},1)">
      <circle class="head" cx="0" cy="-72" r="11"/>${face}
      <line x1="0" y1="-61" x2="0" y2="-28"/>${arms}${legs}${o.extra || ''}
    </g></g>
    ${label ? `<text class="lbl" y="20" fill="${color}">${label}</text>` : ''}</g>`;
}
// 말풍선: (x,y) 는 풍선 왼쪽 위, tail 은 꼬리 끝 좌표
function bub(x, y, w, lines, tail, cls = 'pop', delay = 0) {
  const h = 10 + lines.length * 17;
  const t = tail ? `<path d="M${x + 18} ${y + h - 1} L${tail[0]} ${tail[1]} L${x + 34} ${y + h - 1}" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>` : '';
  return `<g class="bub ${cls}" style="animation-delay:${delay}s">${t}<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9"/>
    ${tail ? `<line x1="${x + 19}" y1="${y + h - 1}" x2="${x + 33}" y2="${y + h - 1}" stroke="#fff" stroke-width="3"/>` : ''}
    ${lines.map((l, i) => `<text x="${x + 10}" y="${y + 20 + i * 17}">${l}</text>`).join('')}</g>`;
}
// 상자(산출물)와 꼬리표
function box(x, y, tags = [], w = 46) {
  const t = tags.map((s, i) => `<g transform="translate(${x + w + 4},${y + 4 + i * 15})"><rect width="38" height="13" rx="3" fill="${s[1]}"/><text x="19" y="10" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">${s[0]}</text></g>`).join('');
  return `<g><rect x="${x}" y="${y}" width="${w}" height="${w * 0.8}" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="2"/><line x1="${x}" y1="${y + 10}" x2="${x + w}" y2="${y + 10}" stroke="#b45309" stroke-width="2"/>${t}</g>`;
}
const TAGS = [['BIN', '#475569'], ['SBOM', '#2563eb'], ['서명', '#059669']];
function check(x, y, c = 'var(--ok)', d = 0) { return `<g class="pop" style="animation-delay:${d}s"><circle cx="${x}" cy="${y}" r="10" fill="${c}"/><path d="M${x - 5} ${y} l3.5 4 l6.5 -8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/></g>`; }
function cross(x, y, d = 0) { return `<g class="pop" style="animation-delay:${d}s"><circle cx="${x}" cy="${y}" r="10" fill="var(--bad)"/><path d="M${x - 4} ${y - 4} l8 8 M${x + 4} ${y - 4} l-8 8" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>`; }
function env(x, y, c = 'var(--tl)') { return `<g transform="translate(${x},${y})"><rect width="30" height="20" rx="3" fill="#fff" stroke="${c}" stroke-width="2"/><path d="M1 2 L15 12 L29 2" stroke="${c}" stroke-width="2" fill="none"/></g>`; }
function doc(x, y, c = '#475569', title = '') { return `<g transform="translate(${x},${y})"><path d="M0 0 h24 l8 8 v32 h-32z" fill="#fff" stroke="${c}" stroke-width="2"/><line x1="6" y1="16" x2="26" y2="16" stroke="${c}" stroke-width="1.6"/><line x1="6" y1="23" x2="26" y2="23" stroke="${c}" stroke-width="1.6"/><line x1="6" y1="30" x2="20" y2="30" stroke="${c}" stroke-width="1.6"/>${title ? `<text x="16" y="54" font-size="10" text-anchor="middle" fill="${c}" font-weight="700">${title}</text>` : ''}</g>`; }
// 이동: from → to 로 dur 초 동안 움직이는 묶음(SMIL — 장면을 다시 그리면 처음부터)
function move(inner, dx, dy, dur, begin = 0, fill = 'freeze') {
  return `<g>${inner}<animateTransform attributeName="transform" type="translate" from="0 0" to="${dx} ${dy}" dur="${dur}s" begin="${begin}s" fill="${fill}"/></g>`;
}
const G = '<line class="ground" x1="10" y1="300" x2="630" y2="300"/>';
const TL = (x, y, s = 1) => `<g transform="translate(${x},${y}) scale(${s})"><circle r="22" fill="var(--tl)"/><path d="M-9 -2 a7 7 0 0 1 9 -7 a7 7 0 0 1 9 7 M-9 4 a7 7 0 0 0 9 7 a7 7 0 0 0 9 -7" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round"/><text y="40" class="lbl" fill="var(--tl)">TrustLink</text></g>`;

// ── 장면 ───────────────────────────────────────────────────────────────────
// 이야기(탭)마다 장면 몇 개. 한 장면에는 메시지 하나만 담는다.
const FLOW = [
{
  tab: '문제', kicker: 'WHY', title: '"이 소프트웨어, 안에 뭐가 들었죠?"',
  text: '소프트웨어를 납품할 때마다 원청은 구성요소 목록, 취약점, 규제 증빙을 요구합니다. 메일과 엑셀로 답하다 보면 버전은 엇갈리고 새 취약점은 놓칩니다.',
  list: ['구성요소 목록(SBOM)은 어디에?', '새 취약점이 나오면 누가, 언제 알려 주나?', 'CRA·EO 14028 같은 규제 증빙은?'],
  svg: () => G +
    fig(130, 300, 'var(--dev)', '개발사', 'hold', { sad: true, extra: '' }) + box(150, 232) +
    fig(500, 300, 'var(--cus)', '원청', 'point', { flip: true }) +
    bub(390, 70, 210, ['이 안에 뭐가 들었죠?', '취약점은 없나요? 규제 증빙은요?'], [470, 200], 'pop', .2) +
    bub(40, 90, 175, ['엑셀로 정리해서', '메일로 보내 드릴게요…'], [120, 200], 'pop', 1.3) +
    `<g class="fade" style="animation-delay:2s">${doc(270, 150, '#94a3b8', 'v1.2 최종')}${doc(310, 190, '#94a3b8', '최종_수정')}${env(290, 245, '#94a3b8')}${doc(350, 140, '#94a3b8', '진짜최종')}</g>` +
    `<text class="lbl pop" x="330" y="125" fill="var(--bad)" style="animation-delay:2.6s">?!</text>`
},
{
  tab: '저장', kicker: '1 · STORE', title: '한 곳에 버전별로 보관합니다',
  text: '개발사는 바이너리와 함께 SBOM, 서명을 TrustLink 레지스트리에 올립니다. 제품과 버전마다 산출물이 한 묶음으로 남습니다.',
  list: ['<b>OCI 레지스트리</b>에 제품·버전별 보관', 'SBOM 이 없으면 <b>syft</b> 로 바로 생성', '<b>서명</b>으로 위·변조 여부 확인', '계정·권한(Keycloak)으로 제품마다 접근 관리'],
  svg: () => G +
    `<g transform="translate(430,110)"><rect width="170" height="190" rx="6" fill="#fff" stroke="var(--tl)" stroke-width="2.5"/>
      <text x="85" y="-10" class="lbl" fill="var(--tl)">레지스트리</text>
      ${[0, 1, 2].map(i => `<line x1="0" y1="${60 + i * 60}" x2="170" y2="${60 + i * 60}" stroke="var(--soft)" stroke-width="3"/>`).join('')}
      <text x="12" y="52" class="sm" text-anchor="start">v1.0</text><rect x="60" y="22" width="40" height="32" rx="3" fill="#fef3c7" stroke="#d6a84e"/>
      <text x="12" y="112" class="sm" text-anchor="start">v1.1</text><rect x="60" y="82" width="40" height="32" rx="3" fill="#fef3c7" stroke="#d6a84e"/>
      <text x="12" y="172" class="sm" text-anchor="start">v2.0</text></g>` +
    move(fig(60, 300, 'var(--dev)', '개발사', 'walk') + `<g>${box(80, 232, TAGS)}<set attributeName="opacity" to="0" begin="3.2s" fill="freeze"/></g>`, 250, 0, 3) +
    `<g class="pop" style="animation-delay:3.2s"><rect x="490" y="252" width="40" height="32" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="2"/></g>` +
    check(560, 268, 'var(--ok)', 3.5) +
    `<text class="sm fade" x="515" y="330" style="animation-delay:3.6s">바이너리 + SBOM + 서명 = 한 묶음</text>`
},
{
  tab: '검증', kicker: '2 · VERIFY', title: 'Dependency-Track 이 구성요소를 하나씩 점검합니다',
  text: '올라온 SBOM 은 Dependency-Track 으로 넘어가 구성요소마다 알려진 취약점을 찾습니다. 취약점 DB 는 서버 안에 미러로 두어 인터넷이 막힌 곳에서도 매일 갱신됩니다.',
  list: ['구성요소 × 취약점 DB(OSV) 자동 대조', '<b>KEV</b>(실제 악용됨)와 <b>EPSS</b>(악용 가능성)로 급한 것부터', '지원 종료(EOL)·공개 익스플로잇까지 표시', '대시보드에 제품별 위험 한눈에'],
  svg: () => {
    const comps = ['zlib', 'openssl', 'log4j', 'libpng', 'curl'];
    return G + box(30, 232, [['SBOM', '#2563eb']]) +
      `<rect x="20" y="300" width="600" height="8" rx="4" fill="#e2e8f0"/>` +
      `<g transform="translate(300,170)"><rect x="-40" y="0" width="80" height="130" rx="10" fill="#fff" stroke="var(--tl)" stroke-width="2.5"/>
        <circle cx="0" cy="45" r="20" fill="none" stroke="var(--tl)" stroke-width="4"/><line x1="14" y1="59" x2="28" y2="76" stroke="var(--tl)" stroke-width="5" stroke-linecap="round"/>
        <text y="100" class="lbl" fill="var(--tl)" font-size="11">D-Track</text></g>` +
      `<g transform="translate(300,40)"><ellipse cx="0" cy="0" rx="62" ry="12" fill="#ccfbf1" stroke="var(--reg)" stroke-width="2"/><path d="M-62 0 v40 a62 12 0 0 0 124 0 v-40" fill="#ccfbf1" stroke="var(--reg)" stroke-width="2"/>
        <text y="30" class="lbl" fill="var(--reg)" font-size="11">취약점 DB 미러</text><text y="72" class="sm">OSV · KEV · EPSS · EOL</text></g>` +
      `<line x1="300" y1="122" x2="300" y2="170" stroke="var(--reg)" stroke-width="2" stroke-dasharray="5 4" class="blink"/>` +
      comps.map((c, i) => {
        const bad = c === 'log4j', d = i * 0.9;
        const pill = `<g transform="translate(110,${280})"><rect x="-26" y="-11" width="52" height="20" rx="10" fill="${bad ? '#fee2e2' : '#fff'}" stroke="${bad ? 'var(--bad)' : '#94a3b8'}" stroke-width="1.6"/><text y="4" font-size="10" text-anchor="middle" fill="#334155">${c}</text></g>`;
        return `<g opacity="0">${move(pill, 280 + (4 - i) * 55, 0, 2.2, d)}<set attributeName="opacity" to="1" begin="${d}s" fill="freeze"/></g>` +
          (bad ? `<g class="pop" style="animation-delay:${d + 2.3}s"><rect x="${390 + (4 - i) * 55 - 44}" y="222" width="88" height="22" rx="5" fill="var(--bad)"/><text x="${390 + (4 - i) * 55}" y="237" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">CVE · KEV 악용 중</text></g>`
               : check(390 + (4 - i) * 55, 250, 'var(--ok)', d + 2.3));
      }).join('');
  }
},
{
  tab: '판단', kicker: '3 · TRIAGE', title: '영향이 있는지 판단하고 VEX 로 남깁니다',
  text: '취약점이 있다고 모두 위험한 건 아닙니다. 담당자가 실제 영향을 판단해 VEX(취약점 영향 진술)로 기록하면, 원청은 진짜 고쳐야 할 것만 봅니다.',
  list: ['AI 가 근거와 함께 <b>판단 초안</b> 제시', '최종 판단은 사람이: 영향 없음 · 조사 중 · 수정 필요', '판단 결과를 <b>VEX 문서</b>로 산출물에 첨부·발행'],
  svg: () => G +
    `<rect x="250" y="226" width="200" height="10" rx="3" fill="#cbd5e1"/><line x1="270" y1="236" x2="270" y2="300" stroke="#cbd5e1" stroke-width="5"/><line x1="430" y1="236" x2="430" y2="300" stroke="#cbd5e1" stroke-width="5"/>` +
    fig(200, 300, 'var(--dev)', '보안 담당', 'hold') +
    `<g transform="translate(290,170)"><rect width="74" height="54" rx="6" fill="#fee2e2" stroke="var(--bad)" stroke-width="2"/><text x="37" y="22" font-size="11" text-anchor="middle" fill="var(--bad)" font-weight="700">CVE-2021-</text><text x="37" y="38" font-size="11" text-anchor="middle" fill="var(--bad)" font-weight="700">44228</text></g>` +
    `<g class="pop" style="animation-delay:.6s"><g transform="translate(470,70)"><rect width="150" height="78" rx="10" fill="#fdf4ff" stroke="var(--ai)" stroke-width="2"/>
      <text x="12" y="22" font-size="12" fill="var(--ai)" font-weight="700">✦ AI 초안</text>
      <text x="12" y="42" font-size="11.5" fill="#334155">취약한 클래스 미포함</text><text x="12" y="60" font-size="11.5" fill="#334155">→ 영향 없음 제안</text></g></g>` +
    `<path class="fade" style="animation-delay:.9s" d="M470 140 Q420 160 370 185" stroke="var(--ai)" stroke-width="2" stroke-dasharray="4 4" fill="none"/>` +
    bub(60, 80, 150, ['근거를 확인했고…', '영향 없음으로 확정!'], [180, 200], 'pop', 1.8) +
    `<g class="pop" style="animation-delay:2.6s"><g transform="translate(380,178) rotate(-12)"><rect width="66" height="26" rx="4" fill="none" stroke="var(--ok)" stroke-width="3"/><text x="33" y="18" font-size="12" text-anchor="middle" fill="var(--ok)" font-weight="800">영향 없음</text></g></g>` +
    `<g class="fade" style="animation-delay:3.3s">${doc(520, 220, 'var(--ok)', 'VEX')}</g>`
},
{
  tab: '통보', kicker: '4 · NOTIFY', title: '새 취약점이 나오면 바로 알립니다',

const vbox = (x, y, v, c = '#b45309', fill = '#fde68a') => `<g><rect x="${x}" y="${y}" width="46" height="37" rx="4" fill="${fill}" stroke="${c}" stroke-width="2"/><line x1="${x}" y1="${y + 10}" x2="${x + 46}" y2="${y + 10}" stroke="${c}" stroke-width="2"/><text x="${x + 23}" y="${y + 29}" font-size="12" font-weight="800" text-anchor="middle" fill="${c}">${v}</text></g>`;
const tag = (x, y, t, c, d = 0) => `<g class="pop" style="animation-delay:${d}s"><rect x="${x}" y="${y}" width="${t.length * 7 + 14}" height="17" rx="8" fill="${c}"/><text x="${x + (t.length * 7 + 14) / 2}" y="${y + 12}" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">${t}</text></g>`;
const bolt = (x, y, d = 0) => `<g class="pop" style="animation-delay:${d}s"><path transform="translate(${x},${y})" d="M-6 0 l-12 22 h10 l-5 18 l19 -26 h-10 l7 -14z" fill="#facc15" stroke="#a16207" stroke-width="1.5"/></g>`;
const aiBox = (x, y, w, lines, d = 0) => `<g class="pop" style="animation-delay:${d}s"><g transform="translate(${x},${y})"><rect width="${w}" height="${26 + lines.length * 17}" rx="10" fill="#fdf4ff" stroke="var(--ai)" stroke-width="2"/><text x="12" y="20" font-size="12" fill="var(--ai)" font-weight="700">✦ AI 분석</text>${lines.map((l, i) => `<text x="12" y="${39 + i * 17}" font-size="11" fill="#334155">${l}</text>`).join('')}</g></g>`;
const card = (x, y, name, role, d = 0) => `<g class="pop" style="animation-delay:${d}s"><g transform="translate(${x},${y})"><rect width="96" height="56" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><rect x="8" y="8" width="14" height="14" rx="3" fill="var(--cus)"/><text x="28" y="19" font-size="9" fill="#64748b">고객사 A</text><text x="8" y="38" font-size="12" font-weight="800" fill="#1e1b4b">${name}</text><text x="8" y="50" font-size="9" fill="#64748b">${role}</text></g></g>`;

const STORIES = [
  { name: 'TrustLink 란', scenes: LEDGER },
  { name: '공급망 보안 흐름', scenes: FLOW },
  { name: '출시된 구버전도 계속 검증', scenes: LEGACY },
  { name: '고객 관리', scenes: CUSTOMER },
];

// ── 재생 ───────────────────────────────────────────────────────────────────
const DUR = 11000; // 장면당 자동 넘김 시간(ms)
const svg = document.getElementById('svg'), cap = document.getElementById('cap'), bar = document.getElementById('bar'), prog = document.getElementById('prog'), tabs = document.getElementById('tabs');
let story = 0, cur = 0, playing = !matchMedia('(prefers-reduced-motion: reduce)').matches, t0 = 0, raf = 0;
let S = STORIES[0].scenes;
// 주소 끝 #2 처럼 이야기 번호로 바로 열 수 있다
const fromHash = parseInt(location.hash.slice(1), 10);
if (fromHash >= 1 && fromHash <= STORIES.length) { story = fromHash - 1; S = STORIES[story].scenes; }

function render(i) {
  cur = (i + S.length) % S.length;
  const s = S[cur];
  svg.classList.remove('play');
  svg.innerHTML = `<title id="title">${s.title}</title>` + s.svg();
  void svg.getBBox(); svg.classList.add('play');           // CSS 애니메이션 다시 시작
  try { svg.setCurrentTime(0); } catch (e) { /* SMIL 미지원 브라우저 */ }
  cap.innerHTML = `<div class="kicker">${s.kicker}</div><h2>${s.title}</h2><p>${s.text}</p><ul>${s.list.map(l => `<li>${l}</li>`).join('')}</ul>`;
  [...bar.querySelectorAll('.dot')].forEach((b, k) => { b.classList.toggle('on', k === cur); b.setAttribute('aria-current', k === cur ? 'step' : 'false'); });
  t0 = performance.now();
}
function tick(now) {
  const p = Math.min(1, (now - t0) / DUR);
  prog.style.width = `${((cur + (playing ? p : 0)) / S.length) * 100}%`;
  if (playing && p >= 1) {
    if (cur === S.length - 1) pickStory(story + 1); // 이야기 끝 → 다음 이야기
    else render(cur + 1);
  }
  raf = requestAnimationFrame(tick);
}
function btn(text, cls, on, parent = bar) { const b = document.createElement('button'); b.textContent = text; b.className = cls; b.onclick = on; parent.appendChild(b); return b; }
function buildBar() {
  bar.innerHTML = '';
  btn('◀', 'nav', () => render(cur - 1)).setAttribute('aria-label', '이전 장면');
  S.forEach((s, k) => btn(`${k + 1}. ${s.tab}`, 'dot', () => render(k)));
  btn('▶', 'nav', () => render(cur + 1)).setAttribute('aria-label', '다음 장면');
  bar.appendChild(Object.assign(document.createElement('span'), { className: 'sp' }));
  const pb = btn('', '', () => { playing = !playing; t0 = performance.now(); pb.textContent = playing ? '❚❚ 멈춤' : '▶ 자동 재생'; });
  pb.textContent = playing ? '❚❚ 멈춤' : '▶ 자동 재생';
  btn('↺ 다시 보기', '', () => render(cur));
}
function pickStory(k) {
  story = (k + STORIES.length) % STORIES.length;
  S = STORIES[story].scenes;
  [...tabs.children].forEach((b, j) => { b.classList.toggle('on', j === story); b.setAttribute('aria-selected', j === story); });
  buildBar(); render(0);
}
STORIES.forEach((st, k) => {
  const b = btn('', '', () => pickStory(k), tabs);
  b.setAttribute('role', 'tab');
  b.innerHTML = `${st.name}<span class="n">${st.scenes.length}장면</span>`;
});
addEventListener('keydown', e => { if (e.key === 'ArrowRight') render(cur + 1); if (e.key === 'ArrowLeft') render(cur - 1); });
pickStory(story); raf = requestAnimationFrame(tick);
</script>
</body>
</html>
